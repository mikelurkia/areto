name: Backup producción

# Mitigación provisional y de coste ~cero mientras el proyecto Supabase de
# producción se queda en el plan Free (sin backups diarios/PITR gestionados).
# No sustituye a un backup gestionado — solo cubre el escenario de borrado
# accidental. Revisar si el proyecto sube a Supabase Pro.
on:
  schedule:
    - cron: "17 3 * * *" # diario, hora de baja carga
  workflow_dispatch: {}
  # `migrate-prod.yml` lo invoca como job previo: una migración automática
  # necesita un backup de hace segundos, no el de las 03:17.
  workflow_call: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # pg_dump necesita el SESSION POOLER (puerto 5432), no el de
      # transacciones (6543/pgbouncer) que usa la app: pgbouncer en modo
      # transacción no aguanta la sesión larga de pg_dump. Por eso este secret
      # es distinto de PROD_DATABASE_URL_TRANSACTION.
      #
      # Y no la "Direct connection" del dashboard (db.<ref>.supabase.co): esa
      # solo resuelve por IPv6 en el plan Free y los runners de GitHub son
      # IPv4. El secret se llamaba antes ..._DIRECT y eso costó un despliegue
      # a medias, porque invita a copiar justo la pestaña que no sirve.
      - name: Dump de la base de datos
        env:
          PROD_DATABASE_URL_SESSION: ${{ secrets.PROD_DATABASE_URL_SESSION }}
          # pg_dump se niega a volcar una base de datos de una major posterior
          # a la suya ("aborting because of server version mismatch"), y el
          # runner trae la 16 mientras Supabase corre la 17.
          #
          # Se usa la imagen oficial de Postgres en vez de instalar el cliente
          # por apt: `postgresql-client-17` no está en los repositorios que
          # trae `ubuntu-latest` (el 16 que viene preinstalado es de PGDG, pero
          # esa lista no queda configurada), y añadir el repositorio a mano son
          # cinco líneas más que dependen de que la clave y la URL de PGDG
          # sigan donde están. Con la imagen, la versión es explícita y no
          # depende del estado del runner.
          #
          # Cuando Supabase suba de major, este tag hay que subirlo con ella.
          PG_IMAGE: postgres:17-alpine
        run: |
          # pipefail es imprescindible: sin él, un fallo de pg_dump queda
          # enmascarado por el éxito de gzip y el paso "pasa" generando un
          # dump vacío/corrupto (backup verde pero inservible).
          set -euo pipefail

          if [ -z "${PROD_DATABASE_URL_SESSION:-}" ]; then
            echo "::error::El secret PROD_DATABASE_URL_SESSION no está configurado en el environment 'production'." >&2
            exit 1
          fi

          # OJO con el usuario de la cadena de conexión: si el host es el
          # *session pooler* de Supabase (aws-0-<region>.pooler.supabase.com,
          # puerto 5432) el usuario DEBE ser 'postgres.<project-ref>', no
          # 'postgres' a secas, o la autenticación falla. La "Direct
          # connection" (db.<ref>.supabase.co) es IPv6-only en Free y tampoco
          # funciona desde los runners de GitHub (solo IPv4).
          #
          # Ese error llegó a costar un rato de diagnóstico, porque Postgres
          # solo responde "password authentication failed" y parece un problema
          # de contraseña. Se comprueba antes para decirlo en claro.
          if printf '%s' "$PROD_DATABASE_URL_SESSION" | grep -q '://postgres:' \
             && printf '%s' "$PROD_DATABASE_URL_SESSION" | grep -q 'pooler\.supabase\.com'; then
            echo "::error::PROD_DATABASE_URL_SESSION apunta al pooler con el usuario 'postgres'. Contra el pooler el usuario debe ser 'postgres.<project-ref>'. Cópialo del dashboard: Settings → Database → Connection string → Session pooler." >&2
            exit 1
          fi

          # La "Direct connection" del dashboard tarda nueve segundos en morir
          # con un "Network unreachable" que no dice nada de IPv6. Mejor
          # rechazarla de entrada y explicar por qué.
          if printf '%s' "$PROD_DATABASE_URL_SESSION" | grep -qE '@db\.[a-z0-9]+\.supabase\.co'; then
            echo "::error::PROD_DATABASE_URL_SESSION apunta a la Direct connection (db.<ref>.supabase.co), que en el plan Free solo resuelve por IPv6 y es inalcanzable desde los runners de GitHub. Usa la pestaña 'Session pooler': aws-N-<region>.pooler.supabase.com:5432." >&2
            exit 1
          fi

          # La cadena entra por entorno, no como argumento: así no aparece en
          # la línea de comandos del contenedor.
          docker run --rm -e PGURL="$PROD_DATABASE_URL_SESSION" "$PG_IMAGE" \
            sh -c 'pg_dump "$PGURL" --no-owner --no-privileges' \
            | gzip > areto-prod-backup.sql.gz

          # Sanity check: un dump válido de esta base nunca es tan pequeño.
          size=$(stat -c%s areto-prod-backup.sql.gz)
          echo "Tamaño del dump comprimido: ${size} bytes"
          if [ "$size" -lt 1024 ]; then
            echo "::error::El dump comprimido es sospechosamente pequeño (${size} bytes); probablemente está vacío." >&2
            exit 1
          fi

      # El dump contiene datos personales reales de socios (incl. campos
      # médicos/DNI) — nunca subirlo en claro como artifact, aunque el repo
      # sea privado. Se cifra en simétrico con una passphrase compartida
      # solo entre este workflow y quien necesite restaurar un backup.
      - name: Cifrar el dump
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then
            echo "::error::El secret BACKUP_ENCRYPTION_KEY no está configurado en el environment 'production'." >&2
            exit 1
          fi

          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_ENCRYPTION_KEY" \
            areto-prod-backup.sql.gz
          rm areto-prod-backup.sql.gz

      - uses: actions/upload-artifact@v6
        with:
          name: areto-prod-backup-${{ github.run_id }}
          path: areto-prod-backup.sql.gz.gpg
          retention-days: 30
