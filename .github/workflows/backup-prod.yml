name: Backup producción

# Mitigación provisional y de coste ~cero mientras el proyecto Supabase de
# producción se queda en el plan Free (sin backups diarios/PITR gestionados).
# No sustituye a un backup gestionado — solo cubre el escenario de borrado
# accidental. Revisar si el proyecto sube a Supabase Pro.
on:
  schedule:
    - cron: "17 3 * * *" # diario, hora de baja carga
  workflow_dispatch: {}
  # `migrate-prod.yml` lo invoca como job previo: una migración automática
  # necesita un backup de hace segundos, no el de las 03:17.
  workflow_call: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      # El runner trae pg_dump 16 y Supabase corre Postgres 17: pg_dump se
      # niega a volcar una base de datos de una major posterior a la suya
      # ("aborting because of server version mismatch"), así que hay que
      # instalar el cliente 17 explícitamente. El repositorio PGDG ya viene
      # configurado en ubuntu-latest, de ahí que baste con el install.
      #
      # Cuando Supabase suba de major, este número hay que subirlo con ella;
      # el paso de comprobación de abajo lo dirá en claro si se olvida.
      - name: Instalar pg_dump 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      # pg_dump necesita la conexión DIRECTA (puerto 5432), no el pooler de
      # transacciones (6543/pgbouncer) que usa la app — el pooler no soporta
      # bien el patrón de sesión larga que usa pg_dump. Por eso este secret
      # es distinto de PROD_DATABASE_URL.
      - name: Dump de la base de datos
        env:
          PROD_DATABASE_URL_DIRECT: ${{ secrets.PROD_DATABASE_URL_DIRECT }}
          # Ruta explícita: `apt` deja la 16 como `pg_dump` por defecto, así
          # que llamarlo a secas seguiría fallando igual.
          PG_DUMP: /usr/lib/postgresql/17/bin/pg_dump
        run: |
          # pipefail es imprescindible: sin él, un fallo de pg_dump queda
          # enmascarado por el éxito de gzip y el paso "pasa" generando un
          # dump vacío/corrupto (backup verde pero inservible).
          set -euo pipefail

          if [ -z "${PROD_DATABASE_URL_DIRECT:-}" ]; then
            echo "::error::El secret PROD_DATABASE_URL_DIRECT no está configurado en el environment 'production'." >&2
            exit 1
          fi

          # OJO con el usuario de la cadena de conexión: si el host es el
          # *session pooler* de Supabase (aws-0-<region>.pooler.supabase.com,
          # puerto 5432) el usuario DEBE ser 'postgres.<project-ref>', no
          # 'postgres' a secas, o la autenticación falla. La conexión directa
          # real (db.<ref>.supabase.co) es IPv6-only en Free y no funciona
          # desde los runners de GitHub (solo IPv4).
          #
          # Ese error llegó a costar un rato de diagnóstico, porque Postgres
          # solo responde "password authentication failed" y parece un problema
          # de contraseña. Se comprueba antes para decirlo en claro.
          if printf '%s' "$PROD_DATABASE_URL_DIRECT" | grep -q '://postgres:' \
             && printf '%s' "$PROD_DATABASE_URL_DIRECT" | grep -q 'pooler\.supabase\.com'; then
            echo "::error::PROD_DATABASE_URL_DIRECT apunta al pooler con el usuario 'postgres'. Contra el pooler el usuario debe ser 'postgres.<project-ref>'. Cópialo del dashboard: Settings → Database → Connection string → Session pooler." >&2
            exit 1
          fi

          "$PG_DUMP" "$PROD_DATABASE_URL_DIRECT" --no-owner --no-privileges \
            | gzip > areto-prod-backup.sql.gz

          # Sanity check: un dump válido de esta base nunca es tan pequeño.
          size=$(stat -c%s areto-prod-backup.sql.gz)
          echo "Tamaño del dump comprimido: ${size} bytes"
          if [ "$size" -lt 1024 ]; then
            echo "::error::El dump comprimido es sospechosamente pequeño (${size} bytes); probablemente está vacío." >&2
            exit 1
          fi

      # El dump contiene datos personales reales de socios (incl. campos
      # médicos/DNI) — nunca subirlo en claro como artifact, aunque el repo
      # sea privado. Se cifra en simétrico con una passphrase compartida
      # solo entre este workflow y quien necesite restaurar un backup.
      - name: Cifrar el dump
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${BACKUP_ENCRYPTION_KEY:-}" ]; then
            echo "::error::El secret BACKUP_ENCRYPTION_KEY no está configurado en el environment 'production'." >&2
            exit 1
          fi

          gpg --batch --yes --symmetric --cipher-algo AES256 \
            --passphrase "$BACKUP_ENCRYPTION_KEY" \
            areto-prod-backup.sql.gz
          rm areto-prod-backup.sql.gz

      - uses: actions/upload-artifact@v6
        with:
          name: areto-prod-backup-${{ github.run_id }}
          path: areto-prod-backup.sql.gz.gpg
          retention-days: 30
